function bindOptions(fn){card.querySelectorAll('.option').forEach(b=>b.onclick=()=>{card.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');fn(+b.dataset.i);sfx(620,.045)})}
function showHandoff(){phase='handoff';card.innerHTML=`<div class="handoff"><div class="emoji">🤝</div><div class="phaseLabel">PREDICTIONS LOCKED</div><h2>ふたりの答えがそろったよ</h2><p>予想も本当の答えもロック済み。ふたりそろって、結果を見よう。</p><button class="primary" id="revealBtn">せーので答え合わせ →</button></div>`;$('#revealBtn').onclick=showReveal}
function showReveal(){phase='reveal';let qi=order[round],d=deck[qi],hit1=guesses[0]===answers[1],hit2=guesses[1]===answers[0];if(hit1)points[0]++;if(hit2)points[1]++;let both=hit1&&hit2;let title=both?'以心伝心！ぴったり！':hit1||hit2?'おしい！気持ちは届いてる':'答えはちがったけど、それも発見！';let line=both?'ふたりとも相手の「すき」を見抜いたね。':hit1?`${names[0]}、${names[1]}のことよくわかってる！`:hit2?`${names[1]}、${names[0]}のことよくわかってる！`:'「どうしてそれが好き？」って聞いてみよう。';sfx(both?880:520,.13);$('#round').textContent=`QUESTION ${round+1} / 10 · REVEAL`;$('#score').textContent=`♡ ${points[0]} : ${points[1]} ♡`;$('#dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="dot ${i<=round?'on':''}"></i>`).join('');card.innerHTML=`<div class="phaseLabel">ふたりの答え</div><h2 class="question">${d.q}</h2><div class="reveal"><div class="revealBox"><small>${names[0]} のほんとう</small><strong>${d.o[answers[0]][0]} ${optLabel(qi,answers[0])}</strong><div class="guess">${names[1]} の予想：${guesses[1]===answers[0]?'✅ あたり':'「'+optLabel(qi,guesses[1])+'」'}</div></div><div class="revealBox"><small>${names[1]} のほんとう</small><strong>${d.o[answers[1]][0]} ${optLabel(qi,answers[1])}</strong><div class="guess">${names[0]} の予想：${guesses[0]===answers[1]?'✅ あたり':'「'+optLabel(qi,guesses[0])+'」'}</div></div></div><div class="result"><b>${both?'💞':hit1||hit2?'🌷':'🌱'} ${title}</b><p>${line}</p></div><button class="primary" id="nextBtn">${round<9?'次の質問へ →':'ふたりの結果を見る →'}</button>`;$('#nextBtn').onclick=()=>{if(round<9){round++;answers={};guesses={};showPhase('answer',0)}else showFinal()}}
function showFinal(){phase='final';let total=points[0]+points[1],caption=total>=15?'まるで心がつながってるみたい！':total>=10?'ふたりのこと、よく見てるね。':total>=5?'これからもっと知っていけそう。':'知らない「すき」を見つける旅はこれから。';$('#round').textContent='YOUR LITTLE LOVE REPORT';$('#dots').innerHTML='';card.innerHTML=`<div class="handoff"><div class="emoji">${total>=15?'💗':total>=8?'🌸':'🌱'}</div><div class="phaseLabel">ふたりの以心伝心スコア</div><h2>${points[0]+points[1]} / 20 あたり！</h2><p>${caption}<br>${names[0]}は${points[0]}回、${names[1]}は${points[1]}回、相手の答えを当てたよ。</p><div class="result" style="width:100%"><b>今日わかった、相手の「すき」</b><p>点数より、答えがちがった質問の「なんで？」を聞いてみてね。きっと会話がつづくよ。</p></div><button class="primary" id="again">もう一回あそぶ ↻</button><button class="restart" id="home">名前を変える</button></div>`;$('#again').onclick=()=>$('#start').click();$('#home').onclick=()=>{ $('#game').classList.add('hidden');$('#hero').classList.remove('hidden');$('#setup').classList.remove('hidden')}}
function netStatus(msg){let el=$('#netStatus');if(el)el.textContent=msg}
function showLobbyCard(title,msg,extra=''){ $('#hero').classList.add('hidden');$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');card.innerHTML=`<div class="handoff"><div class="emoji">🌐</div><div class="phaseLabel">遠距離ルーム</div><h2>${title}</h2><p id="netStatus">${msg}</p>${extra}</div>`}
function makeRoomCode(){let a=new Uint8Array(5);crypto.getRandomValues(a);return 'suki-'+Array.from(a,x=>(x%36).toString(36)).join('')}
function setupPeer(peer,role){net.peer=peer;peer.on('error',e=>{if(e.type==='unavailable-id'&&role==='host'){peer.destroy();createOnlineRoom();return}toastNet('接続できませんでした。通信環境を確認してね。')});peer.on('disconnected',()=>toastNet('中継サーバーとの接続が切れました。再接続しています…'));if(role==='host')peer.on('connection',conn=>{if(net.conn){conn.close();return}net.conn=conn;wireConnection(conn,'host')});}
function toastNet(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function createOnlineRoom(){if(!window.Peer){toastNet('オンライン機能の読み込みに失敗しました。ページを再読み込みしてね。');return}let base=$('#name1').value.trim()||'プレイヤー1';net={role:'host',peer:null,conn:null,submissions:{},localIndex:0,room:makeRoomCode()};names=[base,'パートナー'];showLobbyCard('コードを発行中…','接続サーバーに接続しています。');const room=net.room;card.innerHTML=`<div class="handoff"><div class="emoji">🪐</div><div class="phaseLabel">遠距離ルームを作成中</div><h2>相手を待っています</h2><p>このコードを相手に送ってね。相手も同じゲームページを開いてコードを入力します。</p><div class="roomcode" id="roomCode">${room}</div><button class="secondary" id="copyInvite">招待リンクをコピー</button><p class="status" id="netStatus">接続中…</p><button class="restart" id="cancelRoom">やめる</button></div>`;$('#copyInvite').onclick=async()=>{let url=location.href.split('#')[0]+'#join='+encodeURIComponent(room);try{await navigator.clipboard.writeText(url);toastNet('招待リンクをコピーしました')}catch{$('#roomCode').textContent=url;toastNet('リンクを長押ししてコピーしてね')}};$('#cancelRoom').onclick=backHome;let peer=new Peer(room,{debug:0});setupPeer(peer,'host');peer.on('open',()=>netStatus('待機中 · 相手が参加するとゲームが始まります'));}
function joinOnlineRoom(){if(!window.Peer){toastNet('オンライン機能の読み込みに失敗しました。ページを再読み込みしてね。');return}let room=$('#roomInput').value.trim(),name=$('#guestName').value.trim()||'プレイヤー2';if(!room){toastNet('ルームコードを入力してね');return}net={role:'guest',peer:null,conn:null,submissions:{},localIndex:1,room};names=[$('#name1').value.trim()||'プレイヤー1',name];showLobbyCard('接続しています…','相手のルームを探しています。');let peer=new Peer();setupPeer(peer,'guest');peer.on('open',()=>{net.conn=peer.connect(room,{reliable:true,serialization:'json'});wireConnection(net.conn,'guest')});}
function wireConnection(conn,role){conn.on('open',()=>{if(role==='guest')conn.send({type:'hello',name:names[1]});else netStatus('相手が参加しました。ゲームを準備中…')});conn.on('data',msg=>{if(role==='host'){if(msg?.type==='hello'){names[1]=String(msg.name||'パートナー').slice(0,12);$('#name2').value=names[1];startOnlineGame()}else if(msg?.type==='submit')acceptSubmission(1,msg.data)}else{if(msg?.type==='start'){names=msg.names;net.localIndex=1;startOnlineRound(msg.round,msg.qi)}else if(msg?.type==='reveal')renderOnlineReveal(msg);else if(msg?.type==='round')startOnlineRound(msg.round,msg.qi);else if(msg?.type==='final')renderOnlineFinal(msg.points,msg.names)}});conn.on('close',()=>toastNet('相手との接続が切れました。'));conn.on('error',()=>toastNet('接続エラー。コードを確認してね。'));}
function startOnlineGame(){order=shuffle(deck.map((_,i)=>i));round=0;points=[0,0];net.submissions={};net.conn.send({type:'start',names,round,qi:order[round]});net.localIndex=0;startOnlineRound(round,order[round])}
function startOnlineRound(r,qi){round=r;net.submissions={};$('#round').textContent=`QUESTION ${r+1} / 10`;$('#score').textContent=`♡ ${points[0]} : ${points[1]} ♡`;$('#dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="dot ${i<r?'on':''}"></i>`).join('');let d=deck[qi];card.innerHTML=`<div class="phaseLabel"><span class="netBadge">● オンライン接続中</span> · QUESTION ${r+1} / 10</div><h2 class="question">${d.q}</h2><p class="sub">自分の答えと、相手の答えの予想を選んでね。相手には送信するまで見えません。</p><div class="onlineCard"><section class="onlinePanel"><h3>💗 自分のほんとう</h3><div class="options" id="ownOptions">${d.o.map((x,i)=>`<button class="option" data-i="${i}"><span class="ico">${x[0]}</span>${x[1]}</button>`).join('')}</div></section><section class="onlinePanel"><h3>🔮 相手の答えを予想</h3><div class="options" id="guessOptions">${d.o.map((x,i)=>`<button class="option" data-i="${i}"><span class="ico">${x[0]}</span>${x[1]}</button>`).join('')}</div></section></div><button class="primary" id="submitOnline">答えと予想をロック →</button><p class="status" id="onlineWait"></p>`;let own=null,guess=null;const bind=(root,cb)=>card.querySelectorAll(root+' .option').forEach(b=>b.onclick=()=>{card.querySelectorAll(root+' .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');cb(+b.dataset.i)});bind('#ownOptions',i=>own=i);bind('#guessOptions',i=>guess=i);$('#submitOnline').onclick=()=>{if(own===null||guess===null){toastNet('両方の答えを選んでね');return}let data={answer:own,guess};$('#submitOnline').disabled=true;$('#onlineWait').textContent='🔒 回答をロックしました。相手の入力を待っています…';if(net.role==='host')acceptSubmission(0,data);else net.conn.send({type:'submit',data})}}
function acceptSubmission(who,data){if(net.submissions[who])return;net.submissions[who]={answer:Number(data.answer),guess:Number(data.guess)};let count=Object.keys(net.submissions).length;if(count<2){if(net.role==='host'&&$('#onlineWait'))$('#onlineWait').textContent='🔒 回答をロックしました。相手の入力を待っています…';return}let result={type:'reveal',round,qi:order[round],names,answers:[net.submissions[0].answer,net.submissions[1].answer],guesses:[net.submissions[0].guess,net.submissions[1].guess]};if(result.guesses[0]===result.answers[1])points[0]++;if(result.guesses[1]===result.answers[0])points[1]++;result.points=points;net.conn.send(result);renderOnlineReveal(result)}
function renderOnlineReveal(m){phase='online-reveal';points=m.points;let qi=m.qi,d=deck[qi],hit0=m.guesses[0]===m.answers[1],hit1=m.guesses[1]===m.answers[0],both=hit0&&hit1,title=both?'以心伝心！ぴったり！':hit0||hit1?'おしい！気持ちは届いてる':'答えはちがったけど、それも発見！';$('#round').textContent=`QUESTION ${m.round+1} / 10 · REVEAL`; $('#score').textContent=`♡ ${points[0]} : ${points[1]} ♡`;$('#dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="dot ${i<=m.round?'on':''}"></i>`).join('');card.innerHTML=`<div class="phaseLabel">ふたりの答えがそろったよ</div><h2 class="question">${d.q}</h2><div class="reveal">${[0,1].map(i=>`<div class="revealBox"><small>${m.names[i]} のほんとう</small><strong>${d.o[m.answers[i]][0]} ${d.o[m.answers[i]][1]}</strong><div class="guess">${m.names[1-i]}の予想：${m.guesses[1-i]===m.answers[i]?'✅ あたり':'「'+d.o[m.guesses[1-i]][1]+'」'}</div></div>`).join('')}</div><div class="result"><b>${both?'💞':hit0||hit1?'🌷':'🌱'} ${title}</b><p>${both?'ふたりとも相手の「すき」を見抜いたね。':'当たった数：'+points[0]+' / '+points[1]+'。答えがちがった理由も聞いてみよう。'}</p></div>${net.role==='host'?`<button class="primary" id="nextOnline">${m.round<9?'次の質問へ →':'ふたりの結果を見る →'}</button>`:`<p class="status">ホストが次の質問へ進むのを待っています…</p>`}`;if(net.role==='host')$('#nextOnline').onclick=()=>{if(round<9){round++;net.conn.send({type:'round',round,qi:order[round]});startOnlineRound(round,order[round])}else{net.conn.send({type:'final',points,names});renderOnlineFinal(points,names)}}}
function renderOnlineFinal(p,n){$('#round').textContent='YOUR LITTLE LOVE REPORT';$('#score').textContent=`♡ ${p[0]} : ${p[1]} ♡`;$('#dots').innerHTML='';let total=p[0]+p[1];card.innerHTML=`<div class="handoff"><div class="emoji">${total>=15?'💗':total>=8?'🌸':'🌱'}</div><div class="phaseLabel">ふたりの以心伝心スコア</div><h2>${total} / 20 あたり！</h2><p>${n[0]}は${p[0]}回、${n[1]}は${p[1]}回、相手の答えを当てたよ。<br>点数より、答えがちがった質問の「なんで？」を話してみてね。</p><button class="primary" id="homeOnline">最初の画面へ</button></div>`;$('#homeOnline').onclick=backHome}
function backHome(){if(net.peer)net.peer.destroy();net={role:null,peer:null,conn:null,submissions:{},localIndex:0,room:''};$('#game').classList.add('hidden');$('#hero').classList.remove('hidden');$('#setup').classList.remove('hidden')}function sfx(freq=600,dur=.06){if(!audioOn)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
$('#createRoom').onclick=createOnlineRoom;$('#showJoin').onclick=()=>$('#joinBox').classList.toggle('hidden');$('#joinRoom').onclick=joinOnlineRoom;if(location.hash.startsWith('#join=')){$('#joinBox').classList.remove('hidden');$('#roomInput').value=decodeURIComponent(location.hash.slice(6))}$('#sound').onclick=()=>{audioOn=!audioOn;$('#sound').textContent='♪ 音 '+(audioOn?'ON':'OFF');if(audioOn)sfx(700)};
</script></body></html>
